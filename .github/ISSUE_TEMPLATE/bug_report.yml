name: Bug report
description: Report a reproducible player, rendering, audio or campaign problem.
body:
  - type: input
    id: version
    attributes:
      label: Version and launcher
      description: Include the release version and Play.cmd, Play-XR.cmd or source-build options.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and devices
      description: OS, graphics mode, controller and headset/runtime if applicable.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and observed result
      description: Include level, difficulty, view, speed and whether a fresh user profile reproduces it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: If comparing with DOS, include its configuration and the point where behavior differs.
  - type: textarea
    id: evidence
    attributes:
      label: Error or supporting evidence
      description: Paste the exact error or a short recording. Do not attach original game resources, saves or memory dumps; remove personal paths from logs.
